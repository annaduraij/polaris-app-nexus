showcase.resetPersonal: Reset personal preferences
showcase.paletteTitle: Four families. Many purposes.
showcase.paletteDescription: Color sources are independent of their jobs. A
  white secondary button and white primary text can share neutral 100 without
  tying their role mappings together.
showcase.typeTitle: Typography with a purpose.
showcase.typeDescription: Each enabled role selects its own font, weight, size,
  line height and tracking. Width appears only for a real variable-font axis.
showcase.materialTitle: Glass is a material.
showcase.materialDescription: Opacity and blur shape the surface. Album color,
  data colors and status remain independent of the brand palette.
