showcase.dataTitle: Data
showcase.mediaTitle: Album / media
showcase.headerTitle: Centered, by contract.
showcase.headerDescription: Each side supports three units. An icon uses one; a
  rectangle uses one and a half. The menu uses one. Resize the viewport or
  enlarge controls to see measured overflow.
showcase.headerExample: Header example
showcase.headerMixed: Mixed actions
showcase.headerIcons: Three icons per side
showcase.headerButtons: Two buttons per side
showcase.headerOverflow: Overflow actions
showcase.integrationTitle: Two consumers. One engine.
showcase.footer: Polaris 1.0 · Reference fixtures, not migrated applications.
showcase.docs: Integration contract
showcase.lyraHeading: Stay close to the music.
showcase.lyraBody: A neutral glass workspace for playback, library views and the
  details that matter. Album colors live in their own palette.
showcase.photoHeading: A little light, remembered.
showcase.photoBody: Thoughtful photographs, clear plans and a quietly personal experience.
showcase.photoEditorial: Some moments ask us to slow down. Let the ordinary
  become a story worth keeping.
showcase.photoSignature: With warmth, Jay
