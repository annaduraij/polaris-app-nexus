showcase.runtime: The engine is active in every mode. Labs appear in development.
showcase.productionHint: Approved app defaults are active. Personal text size is
  explicitly permitted; development previews stay separate.
showcase.developmentHint: "Changes are local previews. Close either lab or
  reload: the engine keeps your preview. Export for review before changing the
  approved YAML."
