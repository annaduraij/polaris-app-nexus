<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Polaris: Tilted North</title>
  <desc id="desc">A lavender four-point astroid with a vertical axis nearly half again as long as its horizontal axis, tilted 18 degrees.</desc>
  <defs>
    <linearGradient id="starlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efff"/>
      <stop offset="1" stop-color="#ad8de7"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-18 32 32)">
    <path d="M32 4 C32 15.2 43.4 32 51 32 C43.4 32 32 48.8 32 60 C32 48.8 20.6 32 13 32 C20.6 32 32 15.2 32 4Z" fill="url(#starlight)"/>
    <circle cx="32" cy="32" r="2.5" fill="#0b1020"/>
  </g>
</svg>
