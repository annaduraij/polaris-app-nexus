<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="500" viewBox="0 0 1050 500" role="img" aria-labelledby="title desc">
<title id="title">North Needle center options</title>
<desc id="desc">North Needle with a solid center, a fine transparent astroid cutout, and a larger transparent astroid cutout, each shown at large and small sizes.</desc>
