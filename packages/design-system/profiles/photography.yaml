      font: lustria
      size: 40
      weight: 400
      lineHeight: 1.2
      tracking: -0.025
      width: null
    sans_heading:
      font: mulish
      size: 28
      weight: 600
      lineHeight: 1.2
      tracking: -0.02
      width: null
    serif_body:
      font: cormorant
      size: 23
      weight: 400
      lineHeight: 1.55
      tracking: 0
      width: null
    sans_body:
      font: mulish
      size: 16
      weight: 400
      lineHeight: 1.6
      tracking: 0
      width: null
    label:
