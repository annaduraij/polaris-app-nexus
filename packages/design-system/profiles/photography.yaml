    "700": "#00865b"
    "900": "#005239"
  secondary:
    "100": "#ece4c7"
    "300": "#d9c785"
    "500": "#d2c27a"
    "700": "#b3902e"
    "900": "#7d621d"
  accent:
    "100": "#d7f0e7"
    "300": "#7fc5aa"
    "500": "#329c78"
    "700": "#155d46"
    "900": "#0c3628"
semantic:
  page: neutral.900
  surface: neutral.700
  surfaceRaised: neutral.700
  surfaceInset: neutral.900
  text: neutral.100
  textMuted: neutral.300
  border: neutral.500
  focus: secondary.500
  primaryFill: primary.500
  primaryText: neutral.900
  secondaryFill: neutral.100
