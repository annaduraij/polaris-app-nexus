data:
  - "#00b377"
  - "#ccee44"
  - "#6aafce"
  - "#c796e4"
  - "#e19c67"
media:
  - "#4c5585"
  - "#bc7389"
  - "#cca879"
  - "#325d62"
  - "#99929e"
material:
  opacity: 0.72
  blur: 24
  saturation: 1.35
  borderOpacity: 0.14
personal:
  - material.opacity
  - material.blur
  - typography.scale
id: photography
label: Photography
fonts:
  lustria:
    family: Lustria
    fallback: serif
    assets:
      - url: ./assets/fonts/lustria-latin-400-normal.woff2
        weight: "400"
        style: normal
    axes: {}
    weights:
      - 400
  mulish:
    family: Mulish
    fallback: sans-serif
    assets:
      - url: ./assets/fonts/Mulish-VariableFont_wght.ttf
        weight: 200 1000
        style: normal
    axes:
      wght:
        - 200
        - 1000
    weights:
      - 400
      - 600
      - 700
  cormorant:
    family: Cormorant Infant
    fallback: serif
    assets:
      - url: ./assets/fonts/cormorant_infant-latin-400-normal.woff2
        weight: "400"
        style: normal
      - url: ./assets/fonts/cormorant_infant-latin-500-normal.woff2
        weight: "500"
        style: normal
      - url: ./assets/fonts/cormorant_infant-latin-700-normal.woff2
        weight: "700"
        style: normal
    axes: {}
    weights:
      - 400
      - 500
      - 700
  great_vibes:
    family: Great Vibes
    fallback: cursive
    assets:
      - url: ./assets/fonts/great-vibes-latin-400-normal.woff2
        weight: "400"
        style: normal
    axes: {}
    weights:
      - 400
  jetbrains_mono:
    family: JetBrains Mono
    fallback: monospace
    assets:
      - url: ./assets/fonts/jetbrains-mono-latin-400-normal.woff2
        weight: "400"
        style: normal
    axes: {}
    weights:
      - 400
