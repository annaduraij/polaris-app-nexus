<!doctype html>
<!-- Project: Polaris | Date: 2026-09-27 | File: alternate.html
     Description: A list-based alternate entrance to Jay's apps. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Polaris — Jay's App Nexus." />
    <meta name="theme-color" content="#0b1512" />
    <title>Polaris — Alternate</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./alternate.css" />
  </head>
  <body>
    <a class="skip-link" href="#apps">Skip to apps</a>
    <main class="layout">
      <header class="intro">
        <img class="polaris-logo" src="./logo.svg" width="170" height="170" alt="" />
        <h1>Polaris</h1>
        <p class="subtitle">Jay's App Nexus</p>
        <p class="description">A collection of personal projects and useful tools.</p>
      </header>
      <section class="apps" id="apps" aria-label="Apps">
        <a class="app-row" href="https://lyra.ajay.nexus" aria-label="Open Lyra">
          <img class="app-logo lyra-logo" src="./brand/lyra.png" width="64" height="64" alt="" />
          <span class="app-text"><strong>Lyra</strong><small>Music player with Spotify integration</small></span>
          <span class="row-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="app-row" href="https://krona.ajay.nexus" aria-label="Open Krona">
          <img class="app-logo krona-logo" src="./brand/krona.svg" width="64" height="64" alt="" />
          <span class="app-text"><strong>Krona</strong><small>Budgeting, spending, and visualizations</small></span>
          <span class="row-arrow" aria-hidden="true">↗</span>
        </a>
        <article class="app-row upcoming" aria-labelledby="enigma-title">
          <span class="enigma-mark" aria-hidden="true">e<span>·</span></span>
          <span class="app-text"><strong id="enigma-title">Enigma</strong><small>Useful tools for everyday tasks</small></span>
          <span class="soon">Coming soon</span>
        </article>
      </section>
    </main>
  </body>
</html>
