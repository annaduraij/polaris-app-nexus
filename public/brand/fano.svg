<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="mark-title mark-desc">
  <title id="mark-title">Fano — primary expanded-border logo</title>
  <desc id="mark-desc">An edge-to-edge squircle app tile with an expanded 12 px near-black frame, 24 evenly spaced white film cutouts following its continuous corners, a deep forest-teal-gold sensor gradient, and a larger raised gold Polaris astroid with clear tip margins.</desc>
  <defs>
    <linearGradient id="mark-sensor" gradientUnits="userSpaceOnUse" x1="16" y1="112" x2="112" y2="16">
      <stop offset="0" stop-color="#01573A" />
      <stop offset=".5" stop-color="#1E4C51" />
      <stop offset="1" stop-color="#6D6730" />
    </linearGradient>
    <linearGradient id="mark-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4CF" />
      <stop offset="1" stop-color="#D9A55D" />
    </linearGradient>
    <filter id="mark-astroid-shadow" filterUnits="userSpaceOnUse" x="16" y="12" width="96" height="108" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur" />
      <feOffset in="blur" dx="0" dy="1.5" result="offset" />
      <feFlood flood-color="#17221B" flood-opacity=".35" result="color" />
      <feComposite in="color" in2="offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <path d="M30 4 H98 C121.635 4 124 6.365 124 30 V98 C124 121.635 121.635 124 98 124 H30 C6.365 124 4 121.635 4 98 V30 C4 6.365 6.365 4 30 4Z" fill="url(#mark-sensor)" />
