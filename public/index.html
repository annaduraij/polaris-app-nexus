<!doctype html>
<!-- Project: Polaris | Date: 2026-09-27 | File: index.html
     Description: A glass and aurora entrance to Jay's apps. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Polaris — Jay's App Nexus." />
    <meta name="theme-color" content="#07090b" />
    <title>Polaris — Jay's App Nexus</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <a class="skip-link" href="#apps">Skip to apps</a>
    <main class="layout">
      <header class="intro">
        <img class="polaris-logo" src="./logo.svg" width="170" height="170" alt="" />
        <h1>Polaris</h1>
        <p class="subtitle">Jay's App Nexus</p>
        <p class="description">A collection of personal projects and useful tools.</p>
      </header>
      <section class="apps" id="apps" aria-label="Apps">
        <a class="app-row lyra" href="https://lyra.ajay.nexus" aria-label="Open Lyra">
          <span class="logo-panel"><img class="app-logo lyra-logo" src="./brand/lyra.png" width="108" height="108" alt="" /></span>
          <span class="card-content">
            <span class="app-text"><strong>Lyra</strong><small>— Music player with integrated metadata</small></span>
            <span class="row-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
        <a class="app-row krona" href="https://krona.ajay.nexus" aria-label="Open Krona">
          <span class="logo-panel"><img class="app-logo krona-logo" src="./brand/krona.svg" width="112" height="112" alt="" /></span>
          <span class="card-content">
            <span class="app-text"><strong>Krona</strong><small>— Budget planning and spending visualizations</small></span>
            <span class="row-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
        <article class="app-row enigma upcoming" aria-labelledby="enigma-title">
          <span class="logo-panel"><span class="enigma-mark" aria-hidden="true">e<span>·</span></span></span>
          <span class="card-content">
            <span class="app-text"><strong id="enigma-title">Enigma</strong><small>— Useful tools for everyday tasks</small></span>
            <span class="soon">Coming soon</span>
          </span>
        </article>
      </section>
    </main>
  </body>
</html>
