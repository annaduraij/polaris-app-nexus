<!doctype html>
<!-- Project: Polaris | Date: 2026-09-27 | File: index.html
     Description: A simple entrance to Jay's apps and personal projects. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Polaris — Jay's App Nexus." />
    <meta name="theme-color" content="#0b1512" />
    <title>Polaris — Jay's App Nexus</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-shell">
      <header class="site-header">
        <nav class="app-nav" aria-label="Apps">
          <a href="https://lyra.ajay.nexus">Lyra</a>
          <a href="https://krona.ajay.nexus">Krona</a>
          <a href="#enigma">Enigma</a>
        </nav>
      </header>
      <main id="main">
        <section class="intro" aria-labelledby="page-title">
          <img class="polaris-logo" src="./logo.svg" width="290" height="290" alt="" />
          <div class="intro-copy">
            <h1 id="page-title">Polaris</h1>
            <p class="subtitle">Jay's App Nexus</p>
            <p class="description">A collection of personal projects and useful tools.</p>
          </div>
        </section>
        <section class="apps-section" aria-label="Apps">
          <div class="app-grid">
            <a class="app-card" href="https://lyra.ajay.nexus" aria-label="Open Lyra">
              <img class="app-logo lyra-logo" src="./brand/lyra.png" width="96" height="96" alt="" />
              <span class="app-name">Lyra <span class="card-arrow" aria-hidden="true">↗</span></span>
            </a>
            <a class="app-card" href="https://krona.ajay.nexus" aria-label="Open Krona">
              <img class="app-logo krona-logo" src="./brand/krona.svg" width="96" height="96" alt="" />
              <span class="app-name">Krona <span class="card-arrow" aria-hidden="true">↗</span></span>
            </a>
            <article class="app-card upcoming" id="enigma" aria-labelledby="enigma-title">
              <span class="enigma-mark" aria-hidden="true">e<span>·</span></span>
              <h2 class="app-name" id="enigma-title">Enigma</h2>
              <span class="status">Coming soon</span>
            </article>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
